name: PR self-review records

# Collect metadata using trusted default-branch code only. This never executes
# PR code, submits an approving GitHub Review or pushes to protected branches.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  self-review-record:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/self-review ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect evidence and attributed self-review notes
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/ci/build_pr_self_review.py --output "$RUNNER_TEMP/pr-self-review"
      - name: Save review files, including unsuccessful review results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-self-review-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-self-review/
          if-no-files-found: ignore
