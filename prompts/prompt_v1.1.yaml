version: '1.1'
scope: intermediate instruction fragments; not entire role prompts
runtime_source: src/tradingagents/agents/context.py
configuration:
  concise_intermediate_reports: true
  compact_evidence_handoff: true
analyst: "\nEvidence-first brevity: \nCompact evidence handoff: target 300 words for\
  \ this intermediate output. Use short evidence bullets instead of introductory,\
  \ transitional or concluding prose. Keep the required output schema, labelled fields\
  \ and required tables unchanged. For analyst reports, organize the required content\
  \ into verdict/confidence, decision-relevant evidence, conflicting evidence, and\
  \ missing data/limitations; these can be subsections within the required format.\
  \ Each evidence bullet should pair a material fact with source, observation date\
  \ or fiscal period, units/basis, and its decision implication. Cite a fact once\
  \ rather than restating it in a second summary or duplicating a required table in\
  \ prose. For downstream roles, name the decisive upstream facts and new reasoning\
  \ only; do not retell each analyst's report. Preserve contrary evidence, uncertainty,\
  \ unavailable-data notices, price anchors, conditional triggers, cash/position constraints\
  \ and the distinction between unknown holdings and an explicitly empty book. Retain\
  \ every material safety or factual qualification even if this exceeds the target.\
  \ Never invent a source, replace an unknown with zero, or cut evidence merely to\
  \ hit the word target. No extra summary or model call is needed."
